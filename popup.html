<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f2f7fb;
    --text: #0f1419;
    --text-dim: #536471;
    --border: #e1e8ed;
    --accent: #1DA1F2;
    --accent-strong: #0d8bdb;
    --accent-soft: rgba(29, 161, 242, .12);
    --shadow: 0 8px 24px rgba(15, 20, 25, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15202b;
      --bg-soft: #1e2a36;
      --text: #f7f9f9;
      --text-dim: #8b98a5;
      --border: #2f3b48;
      --accent-soft: rgba(29, 161, 242, .18);
      --shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    background: linear-gradient(135deg, #1DA1F2, #0d8bdb 60%, #0a73b8);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .head::after {
    content: "";
    position: absolute;
    right: -18px; top: -18px;
    width: 84px; height: 84px;
    background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .head svg {
    width: 28px; height: 28px;
    flex: none;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .15));
  }
  .head h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: .2px; }
  .head p { margin: 2px 0 0; font-size: 11px; opacity: .85; }
  .body { padding: 14px 16px 14px; }
  .label { font-size: 11px; margin: 0 0 8px; color: var(--text-dim); font-weight: 600; letter-spacing: .3px; }
  .seg {
    display: flex;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 0;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-dim);
    transition: all .18s ease;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    box-shadow: var(--shadow);
  }
  .custom-colors { display: none; margin-top: 10px; }
  .custom-colors.visible { display: block; }
  .color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 8px;
    margin: 0 -8px;
  }
  .color-row input[type="color"] {
    width: 34px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  .url-row { margin-top: 8px; }
  .url-row input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  .url-row input[type="text"]:focus { border-color: var(--accent); }
  .diag { margin-top: 10px; }
  .diag button {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .diag button:hover { border-color: var(--accent); color: var(--accent); }
  .diag-result {
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-strong);
    line-height: 1.5;
    word-break: break-word;
  }
  .diag-note { margin-top: 4px; font-size: 10px; color: var(--text-dim); line-height: 1.5; }
  .preset-row { display: flex; gap: 8px; margin-top: 10px; }
  .preset {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    padding: 0;
    transition: transform .15s ease, border-color .15s ease;
  }
  .preset:hover { transform: scale(1.1); border-color: var(--accent); }
  .divider { height: 1px; background: var(--border); margin: 2px 0 12px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 8px;
    margin: 0 -8px;
    border-radius: 10px;
    transition: background-color .15s ease;
  }
  .row:hover { background: var(--accent-soft); }
  .row.special {
    background: linear-gradient(135deg, rgba(29,161,242,.16), rgba(224,32,144,.14));
    border: 1px solid rgba(29,161,242,.35);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .row.special .special-inner {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row.special .special-inner::before {
    content: "🎨";
    font-size: 14px;
  }
  .row.special.busy {
    background: linear-gradient(135deg, rgba(244,158,11,.18), rgba(224,32,144,.14));
    border-color: rgba(244,158,11,.45);
    margin-top: 6px;
  }
  .row.special.busy .busy-inner {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row.special.busy .busy-inner::before {
    content: "🔕";
    font-size: 14px;
  }
  .row.special.gentle {
    background: linear-gradient(135deg, rgba(29,161,242,.18), rgba(34,197,94,.16));
    border-color: rgba(34,197,94,.5);
  }
  .row.special.gentle .gentle-inner {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row.special.gentle .gentle-inner::before {
    content: "🐦";
    font-size: 14px;
  }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 24px;
    transition: background-color .2s ease;
    cursor: pointer;
  }
  .slider:before {
    content: "";
    position: absolute;
    height: 18px; width: 18px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s ease;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }
  .timer {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .timer-display {
    font-size: 34px;
    font-weight: 800;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--accent);
    margin: 6px 0 10px;
    cursor: pointer;
    user-select: none;
  }
  .timer-presets {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .timer-presets button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 0;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .timer-presets button:hover { border-color: var(--accent); color: var(--accent); }
  .timer-custom {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .timer-custom input {
    flex: 1;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    outline: none;
    min-width: 0;
  }
  .timer-custom input:focus { border-color: var(--accent); }
  .timer-custom button {
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: filter .15s ease;
  }
  .timer-custom button:hover { filter: brightness(1.08); }
  .timer-custom button#timerStop {
    background: var(--border);
    color: var(--text);
  }
  .timer-sound {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 500;
    margin-top: 8px;
  }
  .timer-note {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.5;
  }
  .timer-status {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-strong);
    margin-top: 6px;
    min-height: 16px;
  }
  body.timer-running .timer-presets button,
  body.timer-running .timer-custom input,
  body.timer-running #timerStart {
    opacity: .5;
    pointer-events: none;
  }
  body.timer-done .timer-display { color: #22c55e; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px 12px;
    font-size: 10px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }
  .foot .ver { font-weight: 600; }
</style>
</head>
<body>
  <div class="head">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
    <div>
      <h1 id="t-extName">X to Twitter 2</h1>
      <p id="t-headTagline"></p>
    </div>
  </div>
  <div class="body">
    <div class="timer">
      <div class="label" data-i18n="timerLabel"></div>
      <div class="timer-display" id="timerDisplay" title="クリックでリセット">--:--:--</div>
      <div class="timer-presets">
        <button data-min="60" data-i18n-title="timerPreset1h">1h</button>
        <button data-min="120" data-i18n-title="timerPreset2h">2h</button>
        <button data-min="180" data-i18n-title="timerPreset3h">3h</button>
        <button data-min="360" data-i18n-title="timerPreset6h">6h</button>
        <button data-min="720" data-i18n-title="timerPreset12h">12h</button>
        <button data-min="1440" data-i18n-title="timerPreset24h">24h</button>
      </div>
      <div class="timer-custom">
        <input type="number" id="timerCustom" min="1" max="1440" placeholder="分">
        <button id="timerStart" data-i18n="timerStartLabel"></button>
        <button id="timerStop" data-i18n="timerStopLabel"></button>
      </div>
      <label class="timer-sound">
        <span data-i18n="timerSoundLabel"></span>
        <span class="switch"><input type="checkbox" id="timerSound"><span class="slider"></span></span>
      </label>
      <div class="timer-status" id="timerStatus"></div>
      <div class="timer-note" data-i18n="timerNote"></div>
    </div>
    <label class="row special gentle">
      <span class="gentle-inner" data-i18n="gentleLabel"></span>
      <span class="switch"><input type="checkbox" id="gentle"><span class="slider"></span></span>
    </label>
    <label class="row special">
      <span class="special-inner" data-i18n="artLabel"></span>
      <span class="switch"><input type="checkbox" id="art"><span class="slider"></span></span>
    </label>
    <label class="row special busy">
      <span class="busy-inner" data-i18n="busyLabel"></span>
      <span class="switch"><input type="checkbox" id="busy"><span class="slider"></span></span>
    </label>
    <div class="divider"></div>
    <div class="label" data-i18n="bgLabel"></div>
    <div class="seg" id="seg">
      <button data-mode="auto" data-i18n="bgAuto"></button>
      <button data-mode="light" data-i18n="bgLight"></button>
      <button data-mode="dark" data-i18n="bgDark"></button>
      <button data-mode="custom" data-i18n="bgCustom"></button>
    </div>
    <div class="custom-colors" id="customColors">
      <div class="color-row">
        <span data-i18n="colorTop"></span>
        <input type="color" id="colorTop" value="#C0DEED">
      </div>
      <div class="color-row">
        <span data-i18n="colorBottom"></span>
        <input type="color" id="colorBottom" value="#8EC5E8">
      </div>
      <div class="color-row">
        <span data-i18n="colorAccent"></span>
        <input type="color" id="colorAccent" value="#1DA1F2">
      </div>
      <div class="preset-row">
        <button class="preset" title="空色" data-p='{"top":"#C0DEED","bottom":"#8EC5E8","accent":"#1DA1F2"}'></button>
        <button class="preset" title="夜空" data-p='{"top":"#15202B","bottom":"#1B2A3A","accent":"#8EC5E8"}'></button>
        <button class="preset" title="桜" data-p='{"top":"#FADDE1","bottom":"#F2B8C6","accent":"#E75480"}'></button>
        <button class="preset" title="ミント" data-p='{"top":"#DCF7F0","bottom":"#A7E8D4","accent":"#00B386"}'></button>
        <button class="preset" title="柑橘" data-p='{"top":"#FFF1D6","bottom":"#FFD699","accent":"#F59E0B"}'></button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="label" data-i18n="wallpaperLabel"></div>
    <label class="row">
      <span data-i18n="wallpaperOnLabel"></span>
      <span class="switch"><input type="checkbox" id="wallpaper"><span class="slider"></span></span>
    </label>
    <div class="url-row">
      <input type="text" id="wallpaperUrl" placeholder="https://example.com/wallpaper.jpg">
    </div>
    <div class="divider"></div>
    <label class="row">
      <span data-i18n="filterLabel"></span>
      <span class="switch"><input type="checkbox" id="filter"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="disasterLabel"></span>
      <span class="switch"><input type="checkbox" id="hideDisaster"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="foodLabel"></span>
      <span class="switch"><input type="checkbox" id="hideFood"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="aiHypeLabel"></span>
      <span class="switch"><input type="checkbox" id="hideAiHype"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="hideGovLabel"></span>
      <span class="switch"><input type="checkbox" id="hideGov"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="hideNewsLabel"></span>
      <span class="switch"><input type="checkbox" id="hideNews"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="hideTrendsLabel"></span>
      <span class="switch"><input type="checkbox" id="hideTrends"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="hideFinLabel"></span>
      <span class="switch"><input type="checkbox" id="hideFin"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="hideInsultLabel"></span>
      <span class="switch"><input type="checkbox" id="hideInsult"><span class="slider"></span></span>
    </label>
    <div class="divider"></div>
    <div class="label" data-i18n="strengthLabel"></div>
    <div class="seg" id="strengthSeg">
      <button data-strength="weak" data-i18n="strengthWeak"></button>
      <button data-strength="standard" data-i18n="strengthStandard"></button>
      <button data-strength="strong" data-i18n="strengthStrong"></button>
    </div>
    <div class="diag">
      <button id="diagRun" data-i18n="diagRun"></button>
      <div class="diag-result" id="diagResult"></div>
      <div class="diag-note" data-i18n="diagNote"></div>
    </div>
    <div class="divider"></div>
    <label class="row">
      <span data-i18n="splashLabel"></span>
      <span class="switch"><input type="checkbox" id="splash"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span data-i18n="birdsLabel"></span>
      <span class="switch"><input type="checkbox" id="birds"><span class="slider"></span></span>
    </label>
    <div class="divider"></div>
    <div class="label" data-i18n="langLabel"></div>
    <div class="seg" id="langSeg">
      <button data-lang="ja">日本語</button>
      <button data-lang="en">English</button>
    </div>
  </div>
  <div class="foot">
    <span data-i18n="footNote"></span>
    <span class="ver">v1.10.0</span>
  </div>
  <script src="filters.js"></script>
  <script src="i18n.js"></script>
  <script src="selfcheck.js"></script>
  <script src="popup.js"></script>
</body>
</html>
